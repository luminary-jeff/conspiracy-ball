name: Daily case file

on:
  schedule:
    # GitHub runs cron on a best-effort basis (often hours late, sometimes skipped), so ask twice.
    - cron: "17 12 * * *"     # 12:17 UTC daily (8:17 AM ET) — after Wednesday waivers and Monday night scores
    - cron: "41 16 * * *"     # 16:41 UTC fallback (12:41 PM ET)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Build data + page
        env:
          SIMS: "20000"
        run: python3 site/build_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "conspiracy-ball-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "daily: refresh odds and wire $(date -u +%Y-%m-%d)"
          git pull --rebase -X ours origin main || true
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
