name: Daily case file

on:
  schedule:
    # GitHub runs cron on a best-effort basis (2026-10-05: the 12:17 slot fired at 20:34 UTC and the 16:41
    # slot at 22:53 UTC, so the page refreshed before Monday night ended and was stale all Tuesday).
    # Jeff wants the page current by 6 AM ET, so ask early and keep asking; a refresh with nothing new is free.
    - cron: "17 10 * * *"     # 10:17 UTC (6:17 AM EDT / 5:17 AM EST) — after Monday night scores
    - cron: "47 11 * * *"     # 11:47 UTC retry
    - cron: "17 13 * * *"     # 13:17 UTC retry (after Wednesday waivers)
    - cron: "41 16 * * *"     # 16:41 UTC last resort
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Build data + page
        env:
          SIMS: "20000"
        run: python3 site/build_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "conspiracy-ball-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "daily: refresh odds and wire $(date -u +%Y-%m-%d)"
          git pull --rebase -X ours origin main || true
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
